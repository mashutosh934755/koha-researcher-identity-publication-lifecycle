# Example configuration only.
# Copy outside the repository and insert real credentials locally.

[general]
institution_name = Your Institution
public_base_url = https://library.example.org
staff_base_url = https://staff.example.org
default_timezone = Asia/Kolkata

[researcher]
eligible_categories = FACULTY,RESEARCHER,STAFF
public_visibility_after_verification = 1
sync_active_researchers_only = 1
preserve_former_profiles = 1

[orcid]
enabled = 1
api_base_url = https://pub.orcid.org/v3.0
client_id =
client_secret =
access_token =

[scopus]
enabled = 1
api_base_url = https://api.elsevier.com
api_key =
institutional_token =

[wos]
enabled = 1
api_base_url = https://api.clarivate.com/apis/wos-starter/v1
api_key =

[crossref]
enabled = 1
api_base_url = https://api.crossref.org
mailto = library@example.org

[email]
enabled = 1
from_name = Library
from_address = library@example.org
reply_to = library@example.org
smtp_host =
smtp_port = 587
smtp_username =
smtp_password =
smtp_encryption = STARTTLS

[deduplication]
doi_exact_match = 1
title_year_journal_match = 1
manual_review_threshold = 60
auto_merge_threshold = 85

[disambiguation]
identifier_weight = 55
name_weight = 20
affiliation_weight = 15
timeline_weight = 10
auto_confirm_threshold = 80
manual_review_minimum = 50

[lifecycle]
use_patron_expiry = 1
former_profiles_public = 1
former_sync_enabled = 0

[logging]
log_directory = /var/log/koha/researcher-system
log_level = INFO
